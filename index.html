<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <script> //Se a pessoa nunca viu o baos vindas é automaticamente mandado
    try {
      if (!localStorage.getItem('smartmarket-boas-vindas')) location.replace('boas-vindas.html')
    } catch (e) { }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F0D">
  <meta name="description" content="Encontre qualquer produto e a seção certa do mercado.">
  <title>Smartmarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/slyle.css">
  <script src="js/contraste.js"></script>
</head>

<body>
  <header class="topo">
    <div class="topo-int">
      <div class="marca">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 4h2.5l2 10h10l2-7H7M9.5 19.5h.01M17 19.5h.01" />
        </svg>
        Smartmarket
      </div>
      <label class="busca">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-4-4" />
        </svg>
        <input id="barra-pesquisa" type="search" placeholder="O que você procura?" autocomplete="off"
          enterkeyhint="search" aria-label="Pesquisar produto">
        <button id="limpar" type="button" aria-label="Limpar pesquisa" hidden>×</button>
      </label>
    </div>
  </header>

  <main>
    <section id="atalhos" class="atalhos" aria-label="Atalhos de categorias"></section>
    <section id="resultados" aria-live="polite"></section>
    <section>
      <h2 class="mapa-titulo">Mapa do mercado</h2>
      <p class="mapa-dica">Toque numa seção para ver o que tem nela.</p>
      <div id="tabs"></div>
      <div id="mercado2d"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Principal">
    <a href="boas-vindas.html">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5M5 9v11h5v-6h4v6h5V9" />
      </svg>Início
    </a>
    <a href="index.html" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-4-4" />
      </svg>Buscar
    </a>
    <a href="lista.html">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" />
      </svg>Lista <span id="badge" hidden></span>
    </a>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
